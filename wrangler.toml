name = "rentora"
main = "worker-gateway.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
PI_API_URL = "https://api.minepi.com/v2"
NODE_ENV = "production"
PLATFORM_FEE_RATE = "0.05"
CORS_ORIGIN = "https://your-rentora-app.example"
ADMIN_PI_UIDS = ""

# Configure these bindings in Cloudflare. Do not commit database IDs or secrets.
# Required:
# - D1 binding: RENTORA_DB
# - KV binding: RENTORA_KV
# Required secret (Cloudflare secret, never [vars]):
# - PI_API_KEY
