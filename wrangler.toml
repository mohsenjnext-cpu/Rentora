name = "rentora"
main = "worker-gateway.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "RENTORA_DB"
database_name = "rentora"
database_id = "d8dcbee6-e958-461a-b746-b460f1adb8d5"

[[kv_namespaces]]
binding = "RENTORA_KV"
id = "11f55c0a333b45cb81ce9a1692d2207a"

[[r2_buckets]]
binding = "RENTORA_MEDIA"
bucket_name = "rentora-media"

[vars]
PI_API_URL = "https://api.minepi.com/v2"
NODE_ENV = "production"
PLATFORM_FEE_RATE = "0.05"
CORS_ORIGIN = ""
ADMIN_PI_UIDS = "avina60,mohsenjnext"

# Required secret (Cloudflare secret, never [vars]):
# - PI_API_KEY
