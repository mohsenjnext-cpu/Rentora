<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6D5DF5" />
    <meta name="description" content="Rentora - Peer-to-Peer Rental Marketplace powered by Pi Network. Rent tools, electronics, camping gear, and equipment nearby." />
    
    <!-- OpenGraph Metadata for PiNet & Social Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rentora" />
    <meta property="og:title" content="Rentora | Peer-to-Peer Rental Marketplace on Pi Network" />
    <meta property="og:description" content="Rent tools, electronics, camping gear, and equipment locally with Pi Network cryptocurrency. Secure, peer-to-peer, and community-powered." />
    <meta property="og:url" content="https://rentora.mohsenjnext.workers.dev/" />
    <meta property="og:image" content="https://rentora.mohsenjnext.workers.dev/logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Rentora Logo" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rentora | Peer-to-Peer Rental Marketplace on Pi Network" />
    <meta name="twitter:description" content="Rent tools, electronics, camping gear, and equipment locally with Pi Network cryptocurrency." />
    <meta name="twitter:image" content="https://rentora.mohsenjnext.workers.dev/logo.png" />

    <link rel="manifest" href="/manifest.json" />
    <title>Rentora | Peer-to-Peer Rental Marketplace</title>
    
    <!-- Automatic Cache Purge for Pi Browser WebView -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name);
            }
          });
        }
      }
    </script>
    
    <!-- Official Pi Network SDK -->
    <!-- Load Pi SDK without blocking React bootstrap. piService initializes it when needed. -->
    <script defer src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>
      window.global = window;
      window.process = window.process || { env: { NODE_ENV: 'production' } };
      // Pi Testnet configuration. Initialization itself is handled by piService after React bootstrap.
      window.__PI_CONFIG__ = { version: '2.0', sandbox: false };
    </script>

    <!-- Vazirmatn font for Persian & Arabic, Inter for English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Rentora mobile header visual refinement. Behavior remains in Header.jsx. -->
    <style>
      @media (max-width: 767px) {
        [class*="md:hidden"][class*="sticky"][class*="top-0"] {
          height: 56px !important;
          min-height: 56px !important;
          padding-left: 12px !important;
          padding-right: 12px !important;
          background: rgba(255, 255, 255, 0.96) !important;
          border-bottom: 1px solid rgba(226, 232, 240, 0.75) !important;
          box-shadow: 0 2px 14px rgba(38, 33, 92, 0.06) !important;
        }

        .dark [class*="md:hidden"][class*="sticky"][class*="top-0"] {
          background: rgba(14, 13, 27, 0.96) !important;
          border-bottom-color: rgba(51, 65, 85, 0.7) !important;
          box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18) !important;
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > button:first-child,
        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:last-child > button {
          transition: transform 160ms ease, background-color 160ms ease;
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > button:first-child {
          width: 36px;
          height: 36px;
          padding: 0 !important;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 12px !important;
          background: #EEEDFE;
          color: #26215C;
        }

        .dark [class*="md:hidden"][class*="sticky"][class*="top-0"] > button:first-child {
          background: #1E1B3D;
          color: #EEEDFE;
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > button:first-child:active,
        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:last-child > button:active {
          transform: scale(0.94);
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:nth-child(2) {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          max-width: 48%;
          white-space: nowrap;
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:nth-child(2) > div:first-child {
          gap: 7px !important;
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:nth-child(2) > div:first-child > div:first-child {
          width: 28px !important;
          height: 28px !important;
          border-radius: 9px !important;
          padding: 5px !important;
          box-shadow: 0 3px 10px rgba(38, 33, 92, 0.16);
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:nth-child(2) span {
          font-size: 14px !important;
          letter-spacing: -0.02em;
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:last-child {
          gap: 2px !important;
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:last-child > button {
          width: 34px;
          height: 34px;
          padding: 0 !important;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 10px !important;
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:last-child > button:hover {
          background: #EEEDFE !important;
        }

        .dark [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:last-child > button:hover {
          background: #1E1B3D !important;
        }

        [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:last-child > button:last-child {
          width: 32px;
          height: 32px;
          margin-left: 2px;
          border-radius: 10px !important;
          border-color: #DDD9FF !important;
          box-shadow: 0 2px 8px rgba(38, 33, 92, 0.08);
        }

        .dark [class*="md:hidden"][class*="sticky"][class*="top-0"] > div:last-child > button:last-child {
          border-color: #37325F !important;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body class="bg-[#FAFAFC] dark:bg-[#0E0D1B] text-[#111827] dark:text-[#F3F4F6] antialiased selection:bg-[#534AB7]/20 selection:text-[#26215C] transition-colors duration-200">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FAFAFC; font-family: system-ui, -apple-system, sans-serif; direction: rtl;">
        <div style="width: 52px; height: 52px; border-radius: 14px; background: #26215C; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 26px; font-weight: bold; box-shadow: 0 6px 16px rgba(38,33,92,0.25);">
          π
        </div>
        <div style="margin-top: 16px; font-weight: 800; font-size: 16px; color: #26215C;">
          رنتورا (Rentora)
        </div>
        <div style="margin-top: 6px; font-size: 12px; color: #64748B;">
          در حال بارگذاری پلتفرم امن اجاره...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
