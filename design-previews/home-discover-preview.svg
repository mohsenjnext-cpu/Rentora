<text x="1640" y="855" text-anchor="end" font-family="Arial" font-size="17" font-weight="700" fill="#26215C">قواعد تجربه کاربری</text>
<text x="1640" y="890" text-anchor="end" font-family="Arial" font-size="12" fill="#555">• فیلترهای اصلی همیشه سریع و قابل دسترس</text>
<text x="1640" y="920" text-anchor="end" font-family="Arial" font-size="12" fill="#555">• فیلترهای تخصصی فقط بر اساس دسته فعال ظاهر می‌شوند</text>
<text x="1640" y="950" text-anchor="end" font-family="Arial" font-size="12" fill="#555">• کارت اولویت: تصویر → نام → قیمت → مکان → اعتماد</text>
<text x="1640" y="980" text-anchor="end" font-family="Arial" font-size="12" fill="#555">• موبایل: فیلترها در Bottom Sheet، نه پنل باریک</text>
<text x="1640" y="1010" text-anchor="end" font-family="Arial" font-size="12" fill="#555">• هیچ مقدار مالی UI مرجع نهایی پرداخت نیست</text>
<text x="1640" y="1040" text-anchor="end" font-family="Arial" font-size="12" fill="#555">این نسخه هنوز Preview است، نه کد نهایی صفحه.</text>
