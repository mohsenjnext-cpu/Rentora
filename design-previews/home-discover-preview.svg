</defs>
<rect width="1800" height="1250" fill="#F7F7FB"/>
<text x="80" y="65" font-family="Arial" font-size="30" font-weight="700" fill="#26215C">Rentora • Home + Discover • Design Preview v2</text>
<text x="80" y="98" font-family="Arial" font-size="16" fill="#666">Refined direction after research • RTL • mobile-first • server-authoritative marketplace</text>

<!-- HOME -->
<rect x="70" y="140" width="820" height="1010" rx="30" fill="white" filter="url(#shadow)"/>
<rect x="70" y="140" width="820" height="270" rx="30" fill="url(#hero)"/>
<rect x="70" y="350" width="820" height="60" fill="url(#hero)"/>
<text x="840" y="205" text-anchor="end" font-family="Arial" font-size="28" font-weight="700" fill="white">هر چیزی را که لازم داری، اجاره کن</text>
<text x="840" y="240" text-anchor="end" font-family="Arial" font-size="15" fill="#E9E8FF">از آدم‌های نزدیکت پیدا کن، با اعتماد بیشتر</text>
