<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180"><rect width="1500" height="1180" fill="#f7f7fb"/><text x="60" y="62" font-family="Arial" font-size="30" font-weight="700" fill="#26215C">Rentora • چهار جهت طراحی Home + Discover</text><text x="60" y="92" font-family="Arial" font-size="15" fill="#777">A Classic • B Community • C Premium • Hybrid B+A+C</text><g font-family="Arial"><rect x="50" y="130" width="670" height="460" rx="26" fill="#fff"/><text x="690" y="175" text-anchor="end" font-size="25" font-weight="700" fill="#26215C">A • Marketplace Classic</text><text x="690" y="203" text-anchor="end" font-size="12" fill="#777">سریع، آشنا، فروشگاهی</text><rect x="90" y="230" width="590" height="70" rx="18" fill="#26215C"/><text x="650" y="273" text-anchor="end" font-size="14" fill="#fff">جستجوی کالا، دسته‌بندی یا مکان...</text><rect x="90" y="325" width="180" height="48" rx="12" fill="#EEEDFE"/><rect x="295" y="325" width="180" height="48" rx="12" fill="#f1f1f5"/><rect x="500" y="325" width="180" height="48" rx="12" fill="#f1f1f5"/><text x="180" y="354" text-anchor="middle" font-size="12">دسته‌بندی</text><text x="385" y="354" text-anchor="middle" font-size="12">فیلتر</text><text x="590" y="354" text-anchor="middle" font-size="12">مرتب‌سازی</text><rect x="90" y="400" width="180" height="135" rx="14" fill="#ddd"/><rect x="295" y="400" width="180" height="135" rx="14" fill="#ddd"/><rect x="500" y="400" width="180" height="135" rx="14" fill="#ddd"/><text x="690" y="565" text-anchor="end" font-size="11" fill="#777">مزیت: کمترین اصطکاک برای جستجو و کشف</text><rect x="780" y="130" width="670" height="460" rx="26" fill="#fff"/><text x="1420" y="175" text-anchor="end" font-size="25" font-weight="700" fill="#26215C">B • Community</text><text x="1420" y="203" text-anchor="end" font-size="12" fill="#777">اعتماد، آدم‌ها، محله</text><rect x="820" y="230" width="590" height="115" rx="22" fill="#534AB7"/><text x="1380" y="272" text-anchor="end" font-size="18" font-weight="700" fill="#fff">از آدم‌های اطرافت اجاره کن</text><text x="1380" y="302" text-anchor="end" font-size="11" fill="#E8E7FF">مالک احراز شده • نزدیک من • امتیاز واقعی</text><rect x="820" y="365" width="590" height="62" rx="16" fill="#fff" stroke="#ddd"/><text x="1360" y="402" text-anchor="end" font-size="13" fill="#777">چه چیزی نیاز داری؟</text><rect x="820" y="450" width="190" height="48" rx="12" fill="#EEEDFE"/><rect x="1025" y="450" width="190" height="48" rx="12" fill="#f1f1f5"/><rect x="1230" y="450" width="180" height="48" rx="12" fill="#f1f1f5"/><text x="915" y="479" text-anchor="middle" font-size="11">✓ احراز هویت شده</text><text x="1120" y="479" text-anchor="middle" font-size="11">📍 نزدیک من</text><text x="1320" y="479" text-anchor="middle" font-size="11">★ صاحبان معتبر</text><text x="1410" y="560" text-anchor="end" font-size="11" fill="#777">مزیت: اعتماد و هویت Rentora را پررنگ می‌کند</text><rect x="50" y="620" width="670" height="460" rx="26" fill="#fff"/><text x="690" y="665" text-anchor="end" font-size="25" font-weight="700" fill="#26215C">C • Premium Minimal</text><text x="690" y="693" text-anchor="end" font-size="12" fill="#777">خلوت، تصویری، برندمحور</text><rect x="90" y="720" width="590" height="210" rx="24" fill="#ddd"/><text x="385" y="830" text-anchor="middle" font-size="12" fill="#777">IMAGE / HERO</text><text x="650" y="970" text-anchor="end" font-size="20" font-weight="700">چیزی که می‌خواهی، نزدیک‌تر از چیزی است که فکر می‌کنی</text><rect x="90" y="995" width="590" height="55" rx="16" fill="#26215C"/><text x="385" y="1029" text-anchor="middle" font-size="13" fill="#fff">شروع جستجو</text><rect x="780" y="620" width="670" height="460" rx="26" fill="#fff"/><text x="1420" y="665" text-anchor="end" font-size="25" font-weight="700" fill="#26215C">Hybrid • B + A + C</text><text x="1420" y="693" text-anchor="end" font-size="12" fill="#777">ترکیب پیشنهادی برای تست نهایی</text><rect x="820" y="720" width="590" height="105" rx="22" fill="#534AB7"/><text x="1380" y="762" text-anchor="end" font-size="18" font-weight="700" fill="#fff">Community trust</text><text x="1380" y="792" text-anchor="end" font-size="11" fill="#E8E7FF">هویت و اعتماد، بدون شلوغ کردن صفحه</text><rect x="820" y="845" width="590" height="60" rx="16" fill="#f4f3fa"/><text x="1370" y="881" text-anchor="end" font-size="13" fill="#777">Search سریع + Category + Location + Trust</text><rect x="820" y="925" width="175" height="105" rx="14" fill="#ddd"/><rect x="1010" y="925" width="175" height="105" rx="14" fill="#ddd"/><rect x="1200" y="925" width="210" height="105" rx="14" fill="#ddd"/><text x="1410" y="1055" text-anchor="end" font-size="11" fill="#777">ظاهر C، ساختار A، اعتماد B</text></g></svg>