<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250"><rect width="1800" height="1250" fill="#F7F7FA"/><text x="60" y="70" font-family="Arial" font-size="28" font-weight="700" fill="#26215C">Rentora · Home Interaction States</text>
<g font-family="Arial"><text x="60" y="115" font-size="14" fill="#666">رفتار Search و وضعیت‌های Home، قبل از implementation</text>
<rect x="60" y="150" width="530" height="430" rx="24" fill="#fff"/><text x="90" y="195" font-size="20" font-weight="700">1 · Search Focus</text><rect x="90" y="225" width="470" height="58" rx="16" fill="#fff" stroke="#534AB7" stroke-width="3"/><text x="115" y="261" font-size="14" fill="#777">دوربین</text><rect x="90" y="294" width="470" height="190" rx="16" fill="#fff" stroke="#eee"/><text x="115" y="328" font-size="13" font-weight="700">پیشنهادها</text><text x="115" y="365" font-size="13">📷 دوربین و تجهیزات</text><text x="115" y="403" font-size="13">📷 دوربین Sony</text><text x="115" y="441" font-size="13">📷 لوازم عکاسی</text><text x="115" y="475" font-size="11" fill="#888">انتخاب پیشنهاد یا ادامه تایپ</text>
<rect x="630" y="150" width="530" height="430" rx="24" fill="#fff"/><text x="660" y="195" font-size="20" font-weight="700">2 · Submit → Discover</text><rect x="660" y="225" width="470" height="58" rx="16" fill="#fff" stroke="#ddd"/><text x="685" y="261" font-size="14">دوربین</text><rect x="660" y="310" width="470" height="64" rx="16" fill="#534AB7"/><text x="825" y="350" font-size="15" fill="#fff">جستجو → کشف نتایج</text><text x="660" y="415" font-size="13" fill="#666">query = دوربین</text><text x="660" y="445" font-size="13" fill="#666">نتایج و فیلترها در Discover</text><text x="660" y="485" font-size="11" fill="#888">قیمت، availability و محدودیت‌ها از سرور</text>
<rect x="1200" y="150" width="530" height="430" rx="24" fill="#fff"/><text x="1230" y="195" font-size="20" font-weight="700">3 · Guest / Auth</text><rect x="1230" y="225" width="470" height="120" rx="16" fill="#F7F7FA"/><text x="1255" y="260" font-size="14" font-weight="700">مهمان</text><text x="1255" y="290" font-size="12" fill="#666">کشف و مشاهده آزاد</text><text x="1255" y="318" font-size="12" fill="#666">اقدام‌های نیازمند حساب → ورود</text><rect x="1230" y="365" width="470" height="120" rx="16" fill="#F7F7FA"/><text x="1255" y="400" font-size="14" font-weight="700">کاربر واردشده</text><text x="1255" y="430" font-size="12" fill="#666">Favorite / Chat / Rental actions</text><text x="1255" y="458" font-size="12" fill="#666">حالت حساب از auth سرور تعیین می‌شود</text>
<rect x="60" y="620" width="530" height="470" rx="24" fill="#fff"/><text x="90" y="665" font-size="20" font-weight="700">4 · Loading</text><g fill="#E5E5E5"><rect x="90" y="700" width="470" height="70" rx="14"/><rect x="90" y="790" width="145" height="190" rx="16"/><rect x="250" y="790" width="145" height="190" rx="16"/><rect x="410" y="790" width="150" height="190" rx="16"/></g><text x="90" y="1030" font-size="11" fill="#888">Skeleton بدون داده جعلی</text>
<rect x="630" y="620" width="530" height="470" rx="24" fill="#fff"/><text x="660" y="665" font-size="20" font-weight="700">5 · Empty / No Nearby</text><rect x="660" y="710" width="470" height="180" rx="18" fill="#F7F7FA"/><text x="810" y="770" font-size="18" font-weight="700">موردی نزدیکت پیدا نشد</text><text x="790" y="805" font-size="12" fill="#666">محدوده را تغییر بده یا همه موارد را ببین</text><rect x="790" y="835" width="150" height="38" rx="10" fill="#534AB7"/><text x="825" y="859" font-size="11" fill="#fff">مشاهده همه</text>
<rect x="1200" y="620" width="530" height="470" rx="24" fill="#fff"/><text x="1230" y="665" font-size="20" font-weight="700">6 · Error / Retry</text><rect x="1230" y="710" width="470" height="180" rx="18" fill="#FFF7F7"/><text x="1390" y="770" font-size="18" font-weight="700">بارگذاری انجام نشد</text><text x="1355" y="805" font-size="12" fill="#666">اتصال را بررسی کن و دوباره تلاش کن</text><rect x="1400" y="835" width="130" height="38" rx="10" fill="#534AB7"/><text x="1432" y="859" font-size="11" fill="#fff">تلاش دوباره</text><text x="1230" y="950" font-size="11" fill="#888">خطا باید قابل بازیابی باشد و داده ساختگی نمایش داده نشود</text></g></svg>