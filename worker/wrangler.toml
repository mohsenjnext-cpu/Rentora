name = "rentora-api"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PI_API_URL = "https://api.minepi.com/v2"
NODE_ENV = "production"

# Cloudflare KV Storage for Items, Rentals, and Transactions
[[kv_namespaces]]
binding = "RENTORA_KV"
id = "RENTORA_KV_ID_REPLACE_ME"
preview_id = "RENTORA_KV_PREVIEW_ID_REPLACE_ME"

# Note: PI_API_KEY must be stored as a secret:
# Run: npx wrangler secret put PI_API_KEY
