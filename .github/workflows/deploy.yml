name: Deploy & Cloudflare D1 Diagnostic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-and-diagnostic"
  cancel-in-progress: true

jobs:
  build-and-diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build

      - name: Verify Wrangler Authentication (whoami)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Running wrangler whoami..."
          npx wrangler whoami

      - name: Cloudflare API & D1 Access Diagnostic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=================================================="
          echo "🔍 Cloudflare Account & D1 Routing Diagnostic Check"
          echo "=================================================="

          # 1. Test Cloudflare Account API
          echo "--- 1. Testing Cloudflare Account API ---"
          ACCOUNT_RESP=$(curl -s -w "\n%{http_code}" \
            -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          ACCOUNT_HTTP_STATUS=$(echo "$ACCOUNT_RESP" | tail -n1)
          ACCOUNT_BODY=$(echo "$ACCOUNT_RESP" | sed '$d')

          echo "Account API HTTP Status: ${ACCOUNT_HTTP_STATUS}"
          echo "Account API JSON Response:"
          echo "${ACCOUNT_BODY}" | jq . 2>/dev/null || echo "${ACCOUNT_BODY}"

          echo ""
          # 2. Test Cloudflare D1 Database List API
          echo "--- 2. Testing Cloudflare D1 Database List API ---"
          D1_RESP=$(curl -s -w "\n%{http_code}" \
            -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          D1_HTTP_STATUS=$(echo "$D1_RESP" | tail -n1)
          D1_BODY=$(echo "$D1_RESP" | sed '$d')

          echo "D1 List API HTTP Status: ${D1_HTTP_STATUS}"
          echo "D1 List API JSON Response:"
          echo "${D1_BODY}" | jq . 2>/dev/null || echo "${D1_BODY}"

          echo ""
          echo "=================================================="
          # 3. Evaluate Diagnostic Results
          if [ "${ACCOUNT_HTTP_STATUS}" -eq 200 ] && [ "${D1_HTTP_STATUS}" -ne 200 ]; then
            echo "Account access works, but D1 access fails."
            exit 1
          elif [ "${ACCOUNT_HTTP_STATUS}" -eq 200 ] && [ "${D1_HTTP_STATUS}" -eq 200 ]; then
            echo "Both Account and D1 API access are working."
          else
            echo "Account access returned HTTP ${ACCOUNT_HTTP_STATUS}, D1 access returned HTTP ${D1_HTTP_STATUS}."
            exit 1
          fi

      - name: Verify Cloudflare D1 Database Schema & Migrations
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking D1 database list via wrangler..."
          npx wrangler d1 list || true

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-diagnose
    if: success()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
