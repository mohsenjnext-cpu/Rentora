name: Deploy Rentora to Cloudflare

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "rentora-cloudflare"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RENTORA_D1_DATABASE_ID: d8dcbee6-e958-461a-b746-b460f1adb8d5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate Worker entrypoints
        run: |
          node --check _worker.js
          node --check worker-entry.js
          node --check worker-gateway.js
          node --check worker-gateway2.js

      - name: Build frontend
        run: npm run build

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          echo "Cloudflare credentials are present."

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Show Wrangler version
        run: npx wrangler --version

      - name: Diagnose Cloudflare API access
        shell: bash
        run: |
          set -euo pipefail
          account_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          d1_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          account_code="$(curl -sS -o /tmp/cloudflare-account.json -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$account_url")"
          d1_code="$(curl -sS -o /tmp/cloudflare-d1.json -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$d1_url")"
          echo "Cloudflare Account API HTTP status: ${account_code}"
          echo "Cloudflare D1 List API HTTP status: ${d1_code}"
          if [ "$account_code" != "200" ]; then cat /tmp/cloudflare-account.json; exit 1; fi
          if [ "$d1_code" != "200" ]; then cat /tmp/cloudflare-d1.json; exit 1; fi

      - name: Inspect Cloudflare identity
        run: npx wrangler whoami

      # Database schema changes are intentionally NOT performed during deploy.
      # D1 migrations must be reviewed and applied as a separate, explicit operation.
      # This prevents a frontend/worker deployment from dropping tables, rebuilding data,
      # or changing production constraints without an auditable migration.
      - name: Verify deployment does not mutate D1
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.toml
          echo "D1 schema mutation is disabled in the deployment workflow."
          echo "Apply reviewed D1 migrations separately before deploying code that requires them."

      - name: Deploy Worker and static assets
        run: npx wrangler deploy

      - name: Verify live Worker and Pi payment configuration
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://rentora.mohsenjnext.workers.dev/api/health"
          for attempt in 1 2 3 4 5; do
            body="$(curl -sS "$health_url" || true)"
            echo "Live health response (attempt ${attempt}): ${body}"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "Live Worker health and Pi payment configuration are ready."
              exit 0
            fi
            sleep 3
          done
          echo "Live Worker health check failed. Payment configuration is not ready."
          exit 1
