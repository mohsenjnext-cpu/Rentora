name: Deploy Rentora to Cloudflare

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "rentora-cloudflare"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RENTORA_D1_DATABASE_ID: d8dcbee6-e958-461a-b746-b460f1adb8d5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Pi payment DTO validation and admin identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('_worker.js')
          s = p.read_text()

          if 'function isAdminIdentity(user, env)' not in s:
              marker = "function isAdmin(uid, env) {\n  const allowed = adminUids(env);\n  const id = String(uid || '').trim().toLowerCase();\n  return Boolean(id && (allowed.includes(id) || id === 'avina60' || id === 'mohsenjnext' || id === 'admin_user'));\n}\n"
              if marker not in s:
                  raise SystemExit('admin marker not found')
              s = s.replace(marker, marker + "function isAdminIdentity(user, env) {\n  if (!user) return false;\n  return isAdmin(user.pi_uid, env) || isAdmin(user.username, env);\n}\n", 1)

          s = s.replace("isAdmin(auth.user.pi_uid, env) && auth.user.role !== 'admin'", "!isAdminIdentity(auth.user, env)")
          s = s.replace("isAdmin(auth.user.pi_uid, env) || auth.user.role !== 'admin'", "!isAdminIdentity(auth.user, env)")
          s = s.replace("isAdmin(user.pi_uid, env) && user.role === 'admin'", "isAdminIdentity(user, env)")
          s = s.replace("isAdmin(user.pi_uid, env) ? user.role === 'admin' : false", "isAdminIdentity(user, env)")

          payment_re = re.compile(r"function validatePiPayment\(payment, intent, user\) \{.*?\n\}", re.S)
          payment_new = '''function validatePiPayment(payment, intent, user) {
  const identifier = String(payment?.identifier || payment?.id || '');
  if (!identifier) throw Object.assign(new Error('Pi payment identifier is missing'), { status: 409 });
  if (identifier !== String(intent.pi_payment_id || identifier)) throw Object.assign(new Error('Pi payment identifier mismatch'), { status: 409 });
  const payerUid = payment?.user_uid || payment?.user?.uid || null;
  if (!payerUid) throw Object.assign(new Error('Pi payment payer identity is missing'), { status: 409 });
  if (String(payerUid) !== String(user.pi_uid)) throw Object.assign(new Error('Pi payer mismatch'), { status: 403 });
  const metadataIntent = payment?.metadata?.paymentIntentId;
  if (!metadataIntent || String(metadataIntent) !== String(intent.id)) throw Object.assign(new Error('Pi payment metadata binding is missing or invalid'), { status: 409 });
  const amount = Number(payment?.amount);
  if (!Number.isFinite(amount) || Math.abs(amount - Number(intent.amount)) > 1e-9) throw Object.assign(new Error('Pi payment amount mismatch'), { status: 409 });
  if (String(payment?.memo || '') !== String(intent.memo)) throw Object.assign(new Error('Pi payment memo mismatch'), { status: 409 });
  const flags = payment?.status && typeof payment.status === 'object' ? payment.status : {};
  if (flags.cancelled || flags.user_cancelled) return 'cancelled';
  if (flags.developer_completed) return 'completed';
  if (flags.developer_approved && flags.transaction_verified) return 'complete';
  if (flags.developer_approved) return 'approved';
  return 'pending';
}'''
          s, count = payment_re.subn(payment_new, s, count=1)
          if count != 1:
              raise SystemExit('validatePiPayment block not found')
          p.write_text(s)

          p = Path('src/services/piService.js')
          s = p.read_text().replace("window.Pi.authenticate(['payments', 'username'], onIncompletePayment)", "window.Pi.authenticate(['username', 'payments'], onIncompletePayment)")
          p.write_text(s)
          PY

          node --check _worker.js
          node --check src/services/piService.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js src/services/piService.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: apply Pi payment DTO and admin identity'
            git push origin HEAD:main
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker entrypoints
        run: |
          node --check _worker.js
          node --check worker-entry.js
          node --check worker-gateway.js

      - name: Build frontend
        run: npm run build

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          echo "Cloudflare credentials are present."
          echo "Configured account ID: ${CLOUDFLARE_ACCOUNT_ID:0:6}******${CLOUDFLARE_ACCOUNT_ID: -6}"
          echo "Configured D1 database ID: ${RENTORA_D1_DATABASE_ID:0:8}******${RENTORA_D1_DATABASE_ID: -8}"

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Show Wrangler version
        run: npx wrangler --version

      - name: Diagnose Cloudflare API access
        shell: bash
        run: |
          set -euo pipefail
          account_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          d1_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          echo "=== Testing Account API ==="
          account_code="$(curl -sS -o /tmp/cloudflare-account.json -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$account_url")"
          echo "Cloudflare Account API HTTP status: ${account_code}"
          cat /tmp/cloudflare-account.json
          echo
          echo "=== Testing D1 List API ==="
          d1_code="$(curl -sS -o /tmp/cloudflare-d1.json -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$d1_url")"
          echo "Cloudflare D1 List API HTTP status: ${d1_code}"
          cat /tmp/cloudflare-d1.json
          echo
          if [ "$account_code" != "200" ]; then echo "Account API access failed."; exit 1; fi
          if [ "$d1_code" != "200" ]; then echo "Account access works, but D1 access fails."; exit 1; fi
          echo "Both Account and D1 API access are working."

      - name: Inspect Cloudflare identity
        run: npx wrangler whoami

      - name: Apply D1 rental-based reviews table migration
        run: npx wrangler d1 execute RENTORA_DB --remote --file=db/migrations/0007_rental_reviews.sql

      - name: Apply D1 schema
        run: npx wrangler d1 execute RENTORA_DB --remote --file=db/schema.sql

      - name: Apply D1 payment replay guards
        run: npx wrangler d1 execute RENTORA_DB --remote --file=db/migrations/0003_payment_replay_guards.sql

      - name: Apply D1 listing status guards
        run: npx wrangler d1 execute RENTORA_DB --remote --file=db/migrations/0004_listing_status_guards.sql

      - name: Apply D1 listing contacts table
        run: npx wrangler d1 execute RENTORA_DB --remote --file=db/migrations/0005_listing_contacts.sql

      - name: Apply D1 secure marketplace conversations and messages tables
        run: npx wrangler d1 execute RENTORA_DB --remote --file=db/migrations/0006_secure_marketplace_chat.sql

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
