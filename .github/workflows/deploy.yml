name: Deploy Rentora to Cloudflare

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "rentora-cloudflare"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RENTORA_D1_DATABASE_ID: d8dcbee6-e958-461a-b746-b460f1adb8d5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker entrypoints
        run: |
          node --check _worker.js
          node --check worker-entry.js
          node --check worker-gateway.js
          node --check worker-gateway2.js

      - name: Build frontend
        run: npm run build

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          echo "Cloudflare credentials are present."

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Show Wrangler version
        run: npx wrangler --version

      - name: Diagnose Cloudflare API access
        shell: bash
        run: |
          set -euo pipefail
          account_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          d1_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          account_code="$(curl -sS -o /tmp/cloudflare-account.json -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$account_url")"
          d1_code="$(curl -sS -o /tmp/cloudflare-d1.json -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$d1_url")"
          echo "Cloudflare Account API HTTP status: ${account_code}"
          echo "Cloudflare D1 List API HTTP status: ${d1_code}"
          if [ "$account_code" != "200" ]; then cat /tmp/cloudflare-account.json; exit 1; fi
          if [ "$d1_code" != "200" ]; then cat /tmp/cloudflare-d1.json; exit 1; fi

      - name: Inspect Cloudflare identity
        run: npx wrangler whoami

      - name: Bootstrap D1 schema and guards
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute RENTORA_DB --remote --file=db/schema.sql

          if npx wrangler d1 execute RENTORA_DB --remote --command="SELECT owner_user_id FROM rentals LIMIT 0" >/dev/null 2>&1; then
            echo "rentals.owner_user_id already exists"
          else
            echo "Adding rentals.owner_user_id"
            npx wrangler d1 execute RENTORA_DB --remote --command="ALTER TABLE rentals ADD COLUMN owner_user_id TEXT REFERENCES users(id)"
          fi

          npx wrangler d1 execute RENTORA_DB --remote --command="UPDATE rentals SET status='cancelled' WHERE status='pending_payment' AND julianday(created_at) < julianday('now', '-10 minutes')"
          npx wrangler d1 execute RENTORA_DB --remote --command="DROP TRIGGER IF EXISTS rentals_overlap_guard_insert"
          npx wrangler d1 execute RENTORA_DB --remote --command="DROP TRIGGER IF EXISTS rentals_overlap_guard_update"
          npx wrangler d1 execute RENTORA_DB --remote --command="CREATE TRIGGER rentals_overlap_guard_insert BEFORE INSERT ON rentals FOR EACH ROW WHEN NEW.status IN ('pending_payment','paid','confirmed','active') AND EXISTS (SELECT 1 FROM rentals r WHERE r.listing_id = NEW.listing_id AND r.id <> NEW.id AND r.status IN ('pending_payment','paid','confirmed','active') AND julianday(r.end_date) > julianday(NEW.start_date) AND julianday(r.start_date) < julianday(NEW.end_date) AND (r.status <> 'pending_payment' OR (r.renter_user_id <> NEW.renter_user_id AND julianday(r.created_at) >= julianday('now','-10 minutes')))) BEGIN SELECT RAISE(ABORT, 'listing is already reserved for the requested dates'); END"
          npx wrangler d1 execute RENTORA_DB --remote --command="CREATE TRIGGER rentals_overlap_guard_update BEFORE UPDATE OF listing_id, start_date, end_date, status ON rentals FOR EACH ROW WHEN NEW.status IN ('pending_payment','paid','confirmed','active') AND EXISTS (SELECT 1 FROM rentals r WHERE r.listing_id = NEW.listing_id AND r.id <> NEW.id AND r.status IN ('pending_payment','paid','confirmed','active') AND julianday(r.end_date) > julianday(NEW.start_date) AND julianday(r.start_date) < julianday(NEW.end_date) AND (r.status <> 'pending_payment' OR (r.renter_user_id <> NEW.renter_user_id AND julianday(r.created_at) >= julianday('now','-10 minutes')))) BEGIN SELECT RAISE(ABORT, 'listing is already reserved for the requested dates'); END"
          npx wrangler d1 execute RENTORA_DB --remote --command="UPDATE rentals SET owner_user_id=(SELECT l.owner_user_id FROM listings l WHERE l.id=rentals.listing_id) WHERE owner_user_id IS NULL"
          npx wrangler d1 execute RENTORA_DB --remote --command="CREATE TABLE IF NOT EXISTS transactions_v2 (id TEXT PRIMARY KEY, payment_intent_id TEXT REFERENCES payment_intents(id), pi_payment_id TEXT NOT NULL UNIQUE, pi_txid TEXT, user_id TEXT NOT NULL REFERENCES users(id), amount REAL NOT NULL CHECK (amount > 0), type TEXT NOT NULL DEFAULT 'platform_fee', status TEXT NOT NULL DEFAULT 'completed' CHECK (status IN ('completed','reversed')), created_at TEXT NOT NULL); INSERT OR IGNORE INTO transactions_v2 SELECT id, payment_intent_id, pi_payment_id, pi_txid, user_id, amount, type, status, created_at FROM transactions; DROP TABLE IF EXISTS transactions; ALTER TABLE transactions_v2 RENAME TO transactions; CREATE INDEX IF NOT EXISTS idx_transactions_user ON transactions(user_id);"
          npx wrangler d1 execute RENTORA_DB --remote --command="CREATE INDEX IF NOT EXISTS idx_rentals_owner ON rentals(owner_user_id)"
          npx wrangler d1 execute RENTORA_DB --remote --command="CREATE INDEX IF NOT EXISTS idx_payment_intents_rental_status ON payment_intents(rental_id,status)"
          npx wrangler d1 execute RENTORA_DB --remote --command="CREATE TRIGGER IF NOT EXISTS listings_status_transition_guard BEFORE UPDATE OF status ON listings FOR EACH ROW WHEN NEW.status <> OLD.status AND NOT ((OLD.status='active' AND NEW.status IN ('paused','deleted')) OR (OLD.status='paused' AND NEW.status IN ('active','deleted'))) BEGIN SELECT RAISE(ABORT,'invalid listing status transition'); END"
          npx wrangler d1 execute RENTORA_DB --remote --command="CREATE TRIGGER IF NOT EXISTS rentals_owner_reference_insert AFTER INSERT ON rentals FOR EACH ROW BEGIN UPDATE rentals SET owner_user_id=(SELECT l.owner_user_id FROM listings l WHERE l.id=NEW.listing_id) WHERE id=NEW.id; END"
          npx wrangler d1 execute RENTORA_DB --remote --command="CREATE TRIGGER IF NOT EXISTS rentals_owner_reference_listing_update AFTER UPDATE OF listing_id ON rentals FOR EACH ROW BEGIN UPDATE rentals SET owner_user_id=(SELECT l.owner_user_id FROM listings l WHERE l.id=NEW.listing_id) WHERE id=NEW.id; END"

      - name: Deploy Worker and static assets
        run: npx wrangler deploy

      - name: Verify live Worker and Pi payment configuration
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://rentora.mohsenjnext.workers.dev/api/health"
          for attempt in 1 2 3 4 5; do
            body="$(curl -sS "$health_url" || true)"
            echo "Live health response (attempt ${attempt}): ${body}"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "Live Worker health and Pi payment configuration are ready."
              exit 0
            fi
            sleep 3
          done
          echo "Live Worker health check failed. Payment configuration is not ready."
          exit 1
