name: Deploy Rentora to Cloudflare

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "rentora-cloudflare"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RENTORA_D1_DATABASE_ID: d8dcbee6-e958-461a-b746-b460f1adb8d5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker entrypoints
        run: |
          node --check _worker.js
          node --check worker-entry.js
          node --check worker-gateway.js

      - name: Build frontend
        run: npm run build

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          echo "Cloudflare credentials are present."
          echo "Configured account ID: ${CLOUDFLARE_ACCOUNT_ID:0:6}******${CLOUDFLARE_ACCOUNT_ID: -6}"
          echo "Configured D1 database ID: ${RENTORA_D1_DATABASE_ID:0:8}******${RENTORA_D1_DATABASE_ID: -8}"

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Show Wrangler version
        run: npx wrangler --version

      - name: Diagnose Cloudflare API access
        shell: bash
        run: |
          set -euo pipefail

          account_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          d1_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"

          echo "=== Testing Account API ==="

          account_code="$(curl -sS \
            -o /tmp/cloudflare-account.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$account_url")"

          echo "Cloudflare Account API HTTP status: ${account_code}"
          cat /tmp/cloudflare-account.json
          echo
          echo

          echo "=== Testing D1 List API ==="

          d1_code="$(curl -sS \
            -o /tmp/cloudflare-d1.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$d1_url")"

          echo "Cloudflare D1 List API HTTP status: ${d1_code}"
          cat /tmp/cloudflare-d1.json
          echo
          echo

          if [ "$account_code" != "200" ]; then
            echo "Account API access failed."
            exit 1
          fi

          if [ "$d1_code" != "200" ]; then
            echo "Account access works, but D1 access fails."
            exit 1
          fi

          echo "Both Account and D1 API access are working."

      - name: Inspect Cloudflare identity
        run: npx wrangler whoami

      - name: Apply D1 schema
        run: npx wrangler d1 execute RENTORA_DB --remote --file=db/schema.sql

      - name: Apply D1 payment replay guards
        run: npx wrangler d1 execute RENTORA_DB --remote --file=db/migrations/0003_payment_replay_guards.sql

      - name: Apply D1 listing status guards
        run: npx wrangler d1 execute RENTORA_DB --remote --file=db/migrations/0004_listing_status_guards.sql

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
