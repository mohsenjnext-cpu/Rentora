name: CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts

      - name: Commit generated lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout "${{ github.head_ref }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git commit -m "chore(build): sync stellar sdk lockfile"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Run security regression tests
        run: npm test

      - name: Validate Worker syntax
        run: |
          node --check _worker.js
          node --check worker-entry.js
          node --check worker-gateway.js
          node --check worker-gateway2.js

      - name: Build frontend
        run: npm run build
