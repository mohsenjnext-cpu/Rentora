name: CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Run security regression tests
        run: npm test

      - name: Validate Worker syntax
        run: |
          node --check _worker.js
          node --check worker-entry.js
          node --check worker-gateway.js
          node --check worker-gateway2.js

      - name: Build frontend
        run: npm run build
