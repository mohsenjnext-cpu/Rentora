name: Repair Rentora directly

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: apply Pi payment DTO and admin identity') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          node <<'NODE'
          const fs = require('fs');
          let s = fs.readFileSync('_worker.js', 'utf8');
          const marker = `function isAdmin(uid, env) {
  const allowed = adminUids(env);
  const id = String(uid || '').trim().toLowerCase();
  return Boolean(id && (allowed.includes(id) || id === 'avina60' || id === 'mohsenjnext' || id === 'admin_user'));
}`;
          if (!s.includes('function isAdminIdentity(user, env)')) {
            if (!s.includes(marker)) throw new Error('admin marker not found');
            s = s.replace(marker, marker + `
function isAdminIdentity(user, env) {
  if (!user) return false;
  return isAdmin(user.pi_uid, env) || isAdmin(user.username, env);
}`);
          }
          s = s.replace(/isAdmin\(auth\.user\.pi_uid, env\) && auth\.user\.role === 'admin'/g, 'isAdminIdentity(auth.user, env)');
          s = s.replace(/isAdmin\(auth\.user\.pi_uid, env\) \|\| auth\.user\.role !== 'admin'/g, '!isAdminIdentity(auth.user, env)');
          s = s.replace(/isAdmin\(user\.pi_uid, env\) && user\.role === 'admin'/g, 'isAdminIdentity(user, env)');
          s = s.replace(/isAdmin\(user\.pi_uid, env\) \? user\.role === 'admin' : false/g, 'isAdminIdentity(user, env)');
          const paymentRe = /function validatePiPayment\(payment, intent, user\) \{[\s\S]*?\n\}/;
          const paymentFn = `function validatePiPayment(payment, intent, user) {
  const identifier = String(payment?.identifier || payment?.id || '');
  if (!identifier) throw Object.assign(new Error('Pi payment identifier is missing'), { status: 409 });
  if (identifier !== String(intent.pi_payment_id || identifier)) throw Object.assign(new Error('Pi payment identifier mismatch'), { status: 409 });
  const payerUid = payment?.user_uid || payment?.user?.uid || null;
  if (!payerUid) throw Object.assign(new Error('Pi payment payer identity is missing'), { status: 409 });
  if (String(payerUid) !== String(user.pi_uid)) throw Object.assign(new Error('Pi payer mismatch'), { status: 403 });
  const metadataIntent = payment?.metadata?.paymentIntentId;
  if (!metadataIntent || String(metadataIntent) !== String(intent.id)) throw Object.assign(new Error('Pi payment metadata binding is missing or invalid'), { status: 409 });
  const amount = Number(payment?.amount);
  if (!Number.isFinite(amount) || Math.abs(amount - Number(intent.amount)) > 1e-9) throw Object.assign(new Error('Pi payment amount mismatch'), { status: 409 });
  if (String(payment?.memo || '') !== String(intent.memo)) throw Object.assign(new Error('Pi payment memo mismatch'), { status: 409 });
  const flags = payment?.status && typeof payment.status === 'object' ? payment.status : {};
  if (flags.cancelled || flags.user_cancelled) return 'cancelled';
  if (flags.developer_completed) return 'completed';
  if (flags.developer_approved && flags.transaction_verified) return 'complete';
  if (flags.developer_approved) return 'approved';
  return 'pending';
}`;
          if (!paymentRe.test(s)) throw new Error('validatePiPayment block not found');
          s = s.replace(paymentRe, paymentFn);
          fs.writeFileSync('_worker.js', s);
          let pi = fs.readFileSync('src/services/piService.js', 'utf8');
          pi = pi.replace("window.Pi.authenticate(['payments', 'username'], onIncompletePayment)", "window.Pi.authenticate(['username', 'payments'], onIncompletePayment)");
          fs.writeFileSync('src/services/piService.js', pi);
          NODE
          node --check _worker.js
          node --check src/services/piService.js
          git diff --check
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js src/services/piService.js
          git commit -m 'fix: apply Pi payment DTO and admin identity'
          git push origin HEAD:main
