name: Fix D1 rental binding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and force-push
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker-entry.js')
          s=p.read_text()
          old=".bind(id, listingId, user.id, startDate, endDate, quote.rentalTotal, quote.deposit, quote.platformFee, JSON.stringify(metadata), createdAt, createdAt).run();"
          new=".bind(id, listingId, user.id, startDate, endDate, quote.rentalTotal, quote.deposit, quote.platformFee, JSON.stringify(metadata), createdAt).run();"
          print('matches:', s.count(old))
          assert s.count(old) == 1
          p.write_text(s.replace(old,new,1))
          PY
          node --check worker-entry.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-entry.js
          git rm -f .github/workflows/fix-d1-binding.yml
          git commit -m 'fix: correct D1 rental insert bindings'
          git push --force origin HEAD:main
