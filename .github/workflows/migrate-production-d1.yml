name: Apply Rentora Production D1 Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "rentora-production-d1-migration"
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RENTORA_D1_DATABASE_ID: d8dcbee6-e958-461a-b746-b460f1adb8d5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Inspect Cloudflare identity
        run: npx wrangler whoami

      - name: Verify target D1 database
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 info rentora --remote
          echo "Target database ID: $RENTORA_D1_DATABASE_ID"

      - name: Apply reviewed production migrations
        run: npx wrangler d1 migrations apply rentora --remote

      - name: Show production migration status
        run: npx wrangler d1 migrations list rentora --remote
